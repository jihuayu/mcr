[workspace]
members = [
    "crates/mcr-cli",
    "crates/mcr-elf",
    "crates/mcr-jit",
    "crates/mcr-net",
    "crates/mcr-runtime",
    "crates/mcr-sys",
    "crates/mcr-task",
    "crates/mcr-testkit",
    "crates/mcr-vfs",
    "crates/mcr-win",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
getrandom = "0.4.3"
mcr-cli = { path = "crates/mcr-cli" }
mcr-elf = { path = "crates/mcr-elf" }
mcr-jit = { path = "crates/mcr-jit" }
mcr-net = { path = "crates/mcr-net" }
mcr-runtime = { path = "crates/mcr-runtime" }
mcr-sys = { path = "crates/mcr-sys" }
mcr-task = { path = "crates/mcr-task" }
mcr-testkit = { path = "crates/mcr-testkit" }
mcr-vfs = { path = "crates/mcr-vfs" }
mcr-win = { path = "crates/mcr-win" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
